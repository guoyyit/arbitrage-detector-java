# Bind the local HTTP surface to loopback only: quote input is simulated locally,
# never fetched from an external service.
server.address=127.0.0.1
server.port=8080

# ---- arbitrage detector configuration (arbitrage.*) ----
# per-hop taker fee rate (0.1%)
arbitrage.fee-rate=0.001
# per-hop adverse slippage rate (0.05%)
arbitrage.slippage-rate=0.0005
# net rate (after all hops' fees and slippage) required to raise an opportunity
arbitrage.min-profit-rate=0.001
# maximum number of hops in an arbitrage cycle (two-hop or more)
arbitrage.max-cycle-length=3
# quotes older than this are excluded from every snapshot
arbitrage.quote-ttl=5s
# detection scheduling interval
arbitrage.detection-interval=200ms
# minimum executable size in the cycle's start currency
arbitrage.min-volume=0
# hysteresis band below min-profit-rate used to retract an active opportunity
arbitrage.exit-margin=0.0005
# append-only journal used for crash recovery and auditing
arbitrage.journal-path=data/journal.log
# set true to stream the built-in synthetic local quote feed
arbitrage.simulated-feed.enabled=false
# minimum |delta net rate| that records an UPDATED lifecycle event
arbitrage.update-event-epsilon=0.000000001
